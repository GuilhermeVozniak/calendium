# Calendium — nginx reverse proxy + Let's Encrypt (certbot) sample.
#
# An alternative to the bundled Caddy profile when you already run nginx.
#
# Setup:
#   1. cp deploy/nginx/calendium.conf /etc/nginx/sites-available/calendium.conf
#   2. ln -s /etc/nginx/sites-available/calendium.conf /etc/nginx/sites-enabled/
#   3. Edit server_name below to your domain.
#   4. mkdir -p /var/www/certbot && nginx -t && systemctl reload nginx
#   5. certbot certonly --webroot -w /var/www/certbot -d calendium.example.com
#   6. Enable the HTTPS server block + the redirect at the bottom, reload nginx.
#   7. Renewal is handled by certbot's own systemd timer.
#
# Assumes the compose stack publishes web on 127.0.0.1:3000 and api on
# 127.0.0.1:8080 (the WEB_PORT/API_PORT defaults in .env.example).

upstream calendium_web { server 127.0.0.1:3000; }
upstream calendium_api { server 127.0.0.1:8080; }

# WebSocket/upgrade support for Next.js.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name calendium.example.com;

    client_max_body_size 25m;

    # ACME HTTP-01 challenge (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # After certs are issued, force HTTPS instead of proxying on :80:
    #   location / { return 301 https://$host$request_uri; }

    # --- Plain HTTP proxy (remove once the HTTPS block below is enabled) ---
    location /v1/ {
        proxy_pass http://calendium_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /healthz {
        proxy_pass http://calendium_api;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://calendium_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

