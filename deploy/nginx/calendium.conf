# Calendium — nginx reverse proxy + Let's Encrypt (certbot) sample.
#
# An alternative to the bundled Caddy profile when you already run nginx.
#
# Setup:
#   1. cp deploy/nginx/calendium.conf /etc/nginx/sites-available/calendium.conf
#   2. ln -s /etc/nginx/sites-available/calendium.conf /etc/nginx/sites-enabled/
#   3. Edit server_name below to your domain.
#   4. mkdir -p /var/www/certbot && nginx -t && systemctl reload nginx
#   5. certbot certonly --webroot -w /var/www/certbot -d calendium.example.com
#   6. Enable the HTTPS server block + the redirect at the bottom, reload nginx.
#   7. Renewal is handled by certbot's own systemd timer.
#
# Assumes the compose stack publishes web on 127.0.0.1:3000 and api on
# 127.0.0.1:8080 (the compose defaults: WEB_BIND/API_BIND=127.0.0.1,
# WEB_PORT/API_PORT=3000/8080).

upstream calendium_web { server 127.0.0.1:3000; }
upstream calendium_api { server 127.0.0.1:8080; }

# WebSocket/upgrade support for Next.js.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name calendium.example.com;

    client_max_body_size 25m;

    # ACME HTTP-01 challenge (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # After certs are issued, force HTTPS instead of proxying on :80:
    #   location / { return 301 https://$host$request_uri; }

    # --- Plain HTTP proxy (remove once the HTTPS block below is enabled) ---
    # The web app calls /v1/internal/* on the api directly (INTERNAL_API_URL);
    # it must never be reachable through the proxy.
    location /v1/internal/ { return 404; }

    location /v1/ {
        proxy_pass http://calendium_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Lets the backend build its OAuth callback base (PUBLIC_API_URL) from
        # the public origin instead of the internal upstream address.
        proxy_set_header X-Forwarded-Host $host;
        # The api honours X-Request-Id from this (trusted) proxy: send nginx's
        # own per-request id, never the client's.
        proxy_set_header X-Request-Id $request_id;
    }
    location = /healthz {
        proxy_pass http://calendium_api;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://calendium_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The web app keys sign-in rate limits on the right-most X-Forwarded-For
        # hop outside TRUSTED_PROXY_CIDRS (set TRUST_PROXY=true). Overwriting and
        # appending ($proxy_add_x_forwarded_for) both work for internet clients;
        # appending lets a client inside TRUSTED_PROXY_CIDRS (LAN/VPN) pick its
        # own key, so the /v1/ block below can use $remote_addr too.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

