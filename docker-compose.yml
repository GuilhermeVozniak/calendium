# Calendium — self-hosting stack.
#
#   cp .env.example .env    # then fill it in (see the file's header)
#   docker compose up -d --build                 # db + api + worker + web (api/web on 127.0.0.1 only)
#   docker compose --profile caddy up -d --build # + automatic-HTTPS proxy
#
# All tunables come from .env (auto-loaded for ${...} interpolation below and
# passed into the api/worker containers via env_file).
name: calendium

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calendium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calendium}
      POSTGRES_DB: ${POSTGRES_DB:-calendium}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calendium} -d ${POSTGRES_DB:-calendium}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - calendium

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: calendium-backend:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Bind inside the container; the host mapping is API_PORT below.
      HTTP_ADDR: ":8080"
      # api + worker verify Better Auth JWTs by fetching its JWKS server-to-server.
      # BETTER_AUTH_URL is a *public* origin the api container usually can't reach
      # from inside this network, so default the JWKS to the in-network web
      # service. Override in .env only if web is reachable at another URL.
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://web:3000/api/auth/jwks}
      # The bundled Caddy (or your own proxy on this host) is the only peer
      # that can reach the API, so its X-Forwarded-* headers are trusted:
      # rate limits, logs and OAuth callback URLs see the real client. Same
      # rule, default and TRUSTED_PROXY_CIDRS as web below. Set
      # TRUST_PROXY=false in .env only when clients reach api:8080 directly
      # (API_BIND=0.0.0.0 with no proxy in front).
      TRUST_PROXY: ${TRUST_PROXY:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Loopback by default so only a proxy on this host reaches the API
      # (Docker published ports bypass UFW). LAN without a proxy: API_BIND=0.0.0.0.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
    # Readiness instead of the image's /healthz liveness: 503 while the DB is
    # unreachable or the process is draining, so the proxy stops routing early.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - calendium

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: calendium-backend:latest
    restart: unless-stopped
    # Same image as api; run the worker binary instead of the default api.
    command: ["worker"]
    env_file:
      - path: .env
        required: false
    environment:
      # Same JWKS default as api — the worker also verifies Better Auth JWTs.
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://web:3000/api/auth/jwks}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    # The worker serves no HTTP; the image's /healthz check does not apply.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - calendium

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN:-}
        NEXT_PUBLIC_PADDLE_ENV: ${NEXT_PUBLIC_PADDLE_ENV:-sandbox}
    image: calendium-web:latest
    restart: unless-stopped
    # Better Auth runs inside this service and reads BETTER_AUTH_SECRET/
    # BETTER_AUTH_URL/DATABASE_URL/GOOGLE_*/APPLE_* from .env at RUNTIME.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN:-}
      NEXT_PUBLIC_PADDLE_ENV: ${NEXT_PUBLIC_PADDLE_ENV:-sandbox}
      # Auth rate limits key on the right-most X-Forwarded-For hop outside
      # TRUSTED_PROXY_CIDRS. true (the default here) trusts the bundled Caddy
      # on this network, so each client gets its own bucket. Set
      # TRUST_PROXY=false in .env only if web:3000 is reachable directly from
      # a LAN and no proxy sits in front (see .env.example).
      TRUST_PROXY: ${TRUST_PROXY:-true}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    # Loopback by default, like api above. LAN without a proxy: WEB_BIND=0.0.0.0.
    # The image's HEALTHCHECK (GET /api/health) applies as-is.
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - calendium

  # Optional reverse proxy with automatic HTTPS. Enable with:
  #   docker compose --profile caddy up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - calendium

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  calendium:
    driver: bridge
