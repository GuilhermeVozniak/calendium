[install]
# Hoist workspace dependencies to the root, standard bun monorepo behavior.
linkWorkspacePackages = true
# Bun's default "isolated" store layout (node_modules/.bun/<pkg>@<ver>/node_modules/<pkg>)
# breaks tools that assume a classic flat/hoisted node_modules tree and resolve
# packages by walking up parent directories — notably Metro (RN bundler) and
# Babel's string-based plugin/preset resolution (used by babel-preset-expo /
# jest-expo). "hoisted" installs everything flat, matching what apps/mobile's
# .npmrc (node-linker=hoisted) already signals was intended.
linker = "hoisted"
