name: test

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        # ubuntu-latest ships Docker, so the postgres testcontainers
        # integration tests run here too. -cover prints per-package coverage;
        # a hard threshold gate (e.g. fail under N%) can be layered on later.
        # REQUIRE_DOCKER makes the postgres suite fail loudly (t.Fatalf) if
        # the container can't start, instead of silently t.Skip-ing and
        # passing CI with zero postgres coverage.
        env:
          REQUIRE_DOCKER: "1"
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

