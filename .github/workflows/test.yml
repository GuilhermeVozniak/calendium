name: test

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        # ubuntu-latest ships Docker, so the postgres testcontainers
        # integration tests run here too. -cover prints per-package coverage;
        # a hard threshold gate (e.g. fail under N%) can be layered on later.
        # REQUIRE_DOCKER makes the postgres suite fail loudly (t.Fatalf) if
        # the container can't start, instead of silently t.Skip-ing and
        # passing CI with zero postgres coverage.
        env:
          REQUIRE_DOCKER: "1"
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

  lint-js:
    name: Biome (JS/TS lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bunx biome check .

  lint-go:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [backend, apps/desktop]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # The desktop module cgo-compiles hotkey (X11) + systray (appindicator)
      # + wails (gtk/webkit), so typecheck needs the headers — same set the
      # release gate installs (.github/workflows/release.yml).
      - name: Install Linux system deps (apps/desktop)
        if: matrix.module == 'apps/desktop'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev libayatana-appindicator3-dev

      - name: Set up Bun (apps/desktop)
        if: matrix.module == 'apps/desktop'
        uses: oven-sh/setup-bun@v2

      # main.go has `//go:embed all:frontend/dist`; without a built frontend
      # the typecheck fails with "pattern all:frontend/dist: no matching files".
      - name: Build desktop frontend (main.go embeds frontend/dist)
        if: matrix.module == 'apps/desktop'
        run: bun install --frozen-lockfile && cd apps/desktop/frontend && bun run build

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: ${{ matrix.module }}

  ts-tests:
    name: TS unit tests (shared, web, desktop, mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test packages/shared
        run: bun run test:shared

      - name: Test apps/web
        run: bun run test:web

      - name: Test apps/desktop/frontend
        run: bun run test:desktop

      - name: Test apps/mobile
        run: bun run test:mobile

  e2e:
    name: Playwright e2e (apps/web, demo mode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        run: bun run test:e2e

  docker-build:
    name: Docker images build (backend, web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only (no registry, no push): proves the digest pins resolve
      # and both Dockerfiles still build from the repo root context.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://ci.invalid
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
